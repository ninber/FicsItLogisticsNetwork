name: Native portable regression
on:
  push:
    paths:
      - 'workspace/mods/FicsItLogisticsNetwork/**'
      - 'scripts/test-filn.sh'
      - 'scripts/author-native-depot.py'
      - 'scripts/tests/test_native_depot_authoring.py'
      - 'scripts/filn-dashboard.py'
      - 'scripts/filn_dashboard_model.py'
      - 'scripts/tests/test_filn_dashboard.py'
      - 'scripts/verify-native-package.py'
      - 'scripts/tests/test_native_package_verifier.py'
      - '.github/workflows/filn-portable.yml'
  pull_request:
    paths:
      - 'workspace/mods/FicsItLogisticsNetwork/**'
      - 'scripts/test-filn.sh'
      - 'scripts/author-native-depot.py'
      - 'scripts/tests/test_native_depot_authoring.py'
      - 'scripts/filn-dashboard.py'
      - 'scripts/filn_dashboard_model.py'
      - 'scripts/tests/test_filn_dashboard.py'
      - 'scripts/verify-native-package.py'
      - 'scripts/tests/test_native_package_verifier.py'
      - '.github/workflows/filn-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: "$CXX --version"
      - run: bash scripts/test-filn.sh

      - run: python3 -m unittest discover -s scripts/tests -p 'test_filn_dashboard.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_native_package_verifier.py'
      - run: python3 -m py_compile scripts/author-native-depot.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_native_depot_authoring.py'

      - run: python3 -m unittest discover -s scripts/tests -p 'test_native_prerequisites.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_headless_local.py'
      - run: bash -n scripts/build.sh scripts/headless.sh scripts/install-filn.sh
