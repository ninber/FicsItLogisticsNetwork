name: Native portable regression
on:
  push:
    paths:
      - 'workspace/mods/FicsItLogisticsNetwork/**'
      - 'scripts/test-filn.sh'
      - 'scripts/install-filn.sh'
      - 'scripts/tests/test_install_filn.py'
      - 'scripts/report-native-acceptance.py'
      - 'workspace/specs/014-native-completion/acceptance.json'
      - 'workspace/experiments/FILNLua/dashboard/app.js'
      - 'scripts/author-native-depot.py'
      - 'scripts/tests/test_native_depot_authoring.py'
      - 'scripts/filn-dashboard.py'
      - 'scripts/check-release-compliance.py'
      - 'scripts/prepare-filn-release.py'
      - 'workspace/PUBLICATION.md'
      - 'workspace/experiments/FILNLua/dashboard/**'
      - 'scripts/filn_dashboard_lifecycle.py'
      - 'scripts/tests/test_filn_dashboard_lifecycle.py'
      - 'scripts/install-filn-dashboard-service.sh'
      - 'scripts/start-filn-dashboard.sh'
      - 'scripts/filn_dashboard_model.py'
      - 'scripts/tests/test_filn_dashboard.py'
      - 'scripts/verify-native-package.py'
      - 'scripts/tests/test_native_package_verifier.py'
      - '.github/workflows/filn-portable.yml'
  pull_request:
    paths:
      - 'workspace/mods/FicsItLogisticsNetwork/**'
      - 'scripts/test-filn.sh'
      - 'scripts/install-filn.sh'
      - 'scripts/tests/test_install_filn.py'
      - 'scripts/report-native-acceptance.py'
      - 'workspace/specs/014-native-completion/acceptance.json'
      - 'workspace/experiments/FILNLua/dashboard/app.js'
      - 'scripts/author-native-depot.py'
      - 'scripts/tests/test_native_depot_authoring.py'
      - 'scripts/filn-dashboard.py'
      - 'scripts/check-release-compliance.py'
      - 'scripts/prepare-filn-release.py'
      - 'workspace/PUBLICATION.md'
      - 'workspace/experiments/FILNLua/dashboard/**'
      - 'scripts/filn_dashboard_lifecycle.py'
      - 'scripts/tests/test_filn_dashboard_lifecycle.py'
      - 'scripts/install-filn-dashboard-service.sh'
      - 'scripts/start-filn-dashboard.sh'
      - 'scripts/filn_dashboard_model.py'
      - 'scripts/tests/test_filn_dashboard.py'
      - 'scripts/verify-native-package.py'
      - 'scripts/tests/test_native_package_verifier.py'
      - '.github/workflows/filn-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: "$CXX --version"
      - run: bash scripts/test-filn.sh
      - run: python3 scripts/check-release-compliance.py
      - run: python3 scripts/prepare-filn-release.py

      - run: python3 -m unittest discover -s scripts/tests -p 'test_filn_dashboard.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_filn_dashboard_lifecycle.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_native_package_verifier.py'
      - run: python3 -m py_compile scripts/author-native-depot.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_native_depot_authoring.py'

      - run: python3 -m unittest discover -s scripts/tests -p 'test_native_prerequisites.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_headless_local.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_install_filn.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_native_capacity_calls.py'
      - run: bash -n scripts/build.sh scripts/headless.sh scripts/install-filn.sh

  native-acceptance:
    name: Native gameplay and release acceptance (must fail until evidenced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/report-native-acceptance.py

